name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      VITE_BASE_PATH: /Prateek-Mishra-Portfolio/
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare the React app entry
        run: cp app.html index.html
      - name: Build site
        run: pnpm build
      - name: Publish the built React app to the branch root
        run: |
          set -euo pipefail
          touch .nojekyll
          cp -R dist/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html favicon.svg .nojekyll assets
          if ! git diff --cached --quiet; then
            git commit -m "Publish built portfolio for GitHub Pages"
            git push origin HEAD:main
          fi
          cmp dist/index.html index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the published React build and contact link
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error "${SITE_URL}?verify=${GITHUB_SHA}" -o /tmp/portfolio.html; then
              if cmp -s dist/index.html /tmp/portfolio.html; then
                break
              fi
            fi
            if [ "${attempt}" -eq 18 ]; then
              echo "The live page did not match the generated React HTML."
              exit 1
            fi
            sleep 10
          done

          grep -q 'src="/Prateek-Mishra-Portfolio/assets/.*\.js"' /tmp/portfolio.html
          grep -q 'href="/Prateek-Mishra-Portfolio/assets/.*\.css"' /tmp/portfolio.html
          js_path=$(grep -oE 'src="/Prateek-Mishra-Portfolio/assets/[^"]+\.js"' /tmp/portfolio.html | head -n 1 | cut -d '"' -f 2)
          asset_url=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.urljoin(sys.argv[1], sys.argv[2]))' "${SITE_URL}" "${js_path}")
          curl --fail --silent --show-error "${asset_url}?verify=${GITHUB_SHA}" -o /tmp/portfolio.js
          grep -Fq 'prateekmishra139@gmail.com' /tmp/portfolio.js
          grep -Fq 'mailto:' /tmp/portfolio.js
          grep -Fq 'PRATEEK MISHRA' /tmp/portfolio.js
          portrait_path=$(grep -oE '/Prateek-Mishra-Portfolio/assets/prateek-mishra-[^"]+\.(jpeg|jpg|webp|png)' /tmp/portfolio.js | head -n 1)
          if [ -z "${portrait_path}" ]; then
            echo "The published React bundle does not reference the supplied portrait."
            exit 1
          fi
          portrait_url=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.urljoin(sys.argv[1], sys.argv[2]))' "${SITE_URL}" "${portrait_path}")
          curl --fail --silent --show-error "${portrait_url}?verify=${GITHUB_SHA}" -o /tmp/portrait
          test -s /tmp/portrait
