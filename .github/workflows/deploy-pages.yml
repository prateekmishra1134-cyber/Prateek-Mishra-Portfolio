name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      VITE_BASE_PATH: /Prateek-Mishra-Portfolio/
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build site
        run: pnpm build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published portfolio response
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error "$SITE_URL" -o /tmp/portfolio.html; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "The deployed site did not return a successful response."
              exit 1
            fi
            sleep 10
          done
          grep -q 'Prateek Mishra' /tmp/portfolio.html
          grep -q 'id="home"' /tmp/portfolio.html
          grep -q 'assets/prateek-mishra.jpeg' /tmp/portfolio.html
          curl --fail --silent --show-error "$SITE_URL/assets/prateek-mishra.jpeg" -o /dev/null
          if grep -Eq 'src="/src/main.jsx"|src="/assets/|href="/assets/' /tmp/portfolio.html; then
            echo "Found a root-based Vite or asset path that is unsafe for this project Pages URL."
            exit 1
          fi
